name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  dockerfile_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run dockerfile_lint
        run: npx --yes dockerfile_lint@0.3.4 -f Dockerfile

  docker_build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        run: docker buildx build --load -t tor-socks-proxy:${{ github.sha }} .
